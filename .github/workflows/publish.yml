name: Publish to npm

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # No `version:` input — pnpm/action-setup@v6 reads the pinned version from
      # the `packageManager` field in package.json (pnpm@11.0.8). Passing a bare
      # major here triggers a v6 metadata-resolution bug ("Cannot use 'in'
      # operator to search for 'integrity' in undefined").
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Node 22 ships npm 10.x; Trusted Publishing needs >= 11.5.1.
      - run: npx -y npm@latest publish --access public --provenance
